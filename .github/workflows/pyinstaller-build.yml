name: Build PyInstaller artifacts

on:
  push:
    branches: [ danielzapirtan-transfer-fisiere-ip ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build deps
        run: |
          pip install pyinstaller
          pip install .
      - name: Build (PyInstaller)
        run: |
          pyinstaller --onefile --name transfile scripts/transfile_server.py
      - name: Package artifact
        run: |
          mkdir -p artifacts
          if [ -f dist/transfile ]; then cp dist/transfile artifacts/transfile-linux; fi
          tar -czf artifacts/transfile-linux.tar.gz -C artifacts transfile-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfile-linux
          path: artifacts/transfile-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build deps
        run: |
          pip install pyinstaller
          pip install .
      - name: Build (PyInstaller)
        run: |
          pyinstaller --onefile --name transfile scripts/transfile_server.py
      - name: Package artifact
        run: |
          mkdir -p artifacts
          if [ -f dist/transfile ]; then cp dist/transfile artifacts/transfile-macos; fi
          tar -czf artifacts/transfile-macos.tar.gz -C artifacts transfile-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transfile-macos
          path: artifacts/transfile-macos.tar.gz
