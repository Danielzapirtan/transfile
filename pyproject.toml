[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transfile"
version = "0.1.0"
description = "Minimal IP file transfer server (GET downloads, optional POST upload)."
readme = "docs/transfile_server.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [ { name = "Danielzapirtan" } ]

[project.scripts]
transfile = "transfile.server:main"
